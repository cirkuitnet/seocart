# The build chain: build the release zip, then validate, check and install that exact zip.
#
#   build -> packaging-validate -> plugin-check
#                               -> install-smoke (also needs build-upgrade-base)
#
# build-upgrade-base builds the zip of an earlier commit, the one the upgrade proof of
# install-smoke starts from.
#
# Reusable because two workflows run it: ci.yml on every pull request and release.yml on
# every tag. A release is therefore built and proven by the same jobs as a pull request,
# not by a copy of them. Everything after `build` works on the uploaded zip and never on
# the source tree: what is checked is what ships.
#
# Branch protection sees these jobs under the name of the calling job, for example
# "package / build" and "package / install-smoke (PHP floor, WordPress 7.1)".

name: Package (reusable)

on:
    workflow_call:
        outputs:
            artifact:
                description: 'Name of the workflow artifact that holds seocart-<version>.zip and its SHA256SUMS.'
                value: ${{ jobs.build.outputs.artifact }}
            upgrade-base-artifact:
                description: 'Name of the workflow artifact that holds the zip of the earlier commit the upgrade proof starts from.'
                value: ${{ jobs.build-upgrade-base.outputs.artifact }}

permissions:
    contents: read

env:
    ZIP_ARTIFACT: seocart-zip
    UPGRADE_BASE_ARTIFACT: seocart-zip-upgrade-base
    # The zip is built on the PHP floor (the README.md requirements table) and installed on
    # both the floor and the version the plugin is developed on.
    PHP_FLOOR: '8.3'
    # Throwaway values for the MySQL service container of install-smoke. The container
    # exists for the length of one job and is reachable from nowhere else; these are not
    # secrets and are used for nothing but CI. bin/ci/install-smoke.sh reads them.
    SEOCART_CI_DB_HOST: '127.0.0.1:3306'
    SEOCART_CI_DB_USER: root
    SEOCART_CI_DB_PASSWORD: ci-throwaway
    SEOCART_CI_DB_NAME: seocart_smoke

jobs:
    build:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        outputs:
            artifact: ${{ env.ZIP_ARTIFACT }}
        steps:
            - &checkout
              name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up PHP and Composer
              uses: ./.github/actions/setup-php-composer
              with:
                  php-version: ${{ env.PHP_FLOOR }}
                  install: full

            - name: Set up Node from .nvmrc
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            - name: Build the assets
              run: npm run build

            # Writes dist/seocart-<version>.zip and dist/SHA256SUMS. The checksum is taken here,
            # at build time, by the script that owns it; release.yml verifies it and never
            # computes it again.
            - name: Build the zip
              run: php bin/build-zip.php

            - name: Upload the zip and its checksum
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ${{ env.ZIP_ARTIFACT }}
                  path: |
                      dist/seocart-*.zip
                      dist/SHA256SUMS
                  if-no-files-found: error
                  retention-days: 14

    # The zip install-smoke installs first, to prove an upgrade. The commit is named once, in
    # bin/ci/upgrade-from.env, and the script builds it the way a release is built, so a
    # developer's machine builds the same zip. The earlier zip is not validated or checked: it
    # is what shipped then, not what ships now.
    build-upgrade-base:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        outputs:
            artifact: ${{ env.UPGRADE_BASE_ARTIFACT }}
        steps:
            # Full history: the earlier commit is not the tip of anything a default checkout fetches.
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            # PHP and Composer only: the script runs `composer install` in a checkout of the
            # earlier commit, which has its own composer.lock.
            - name: Set up PHP and Composer
              uses: ./.github/actions/setup-php-composer
              with:
                  php-version: ${{ env.PHP_FLOOR }}
                  install: none

            - name: Set up Node from .nvmrc
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Build the zip of the earlier commit
              run: sh bin/ci/build-older-zip.sh upgrade-base

            - name: Upload the earlier zip
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ${{ env.UPGRADE_BASE_ARTIFACT }}
                  path: |
                      upgrade-base/seocart-*.zip
                      upgrade-base/SHA256SUMS
                  if-no-files-found: error
                  retention-days: 14

    packaging-validate:
        needs: build
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            # The checkout supplies bin/check-zip.php and tools/Packaging/. The checker requires
            # its classes by path and loads no autoloader, so nothing is installed here.
            - *checkout

            - name: Set up PHP and Composer
              uses: ./.github/actions/setup-php-composer
              with:
                  install: none

            - &download-zip
              name: Download the zip
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: ${{ env.ZIP_ARTIFACT }}
                  path: dist

            # Size budget (5 MB, hard limit 10 MB), no development files, nothing outside the
            # list of shipped paths: the rules live in the script.
            - name: Validate the zip
              run: php bin/check-zip.php dist/seocart-*.zip

    plugin-check:
        needs: packaging-validate
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            # No checkout: the only plugin on this runner is the one unpacked from the zip.
            - *download-zip

            - name: Unpack the zip
              run: |
                  unzip -q dist/seocart-*.zip -d plugin
                  test -f plugin/seocart/seocart.php

            # Findings of type ERROR fail the job; WARNING findings are annotations and must
            # reach zero before 1.0. The action takes the plugin slug from the directory name.
            # It gets no token: it would only use one to comment on the pull request, and
            # that needs a write permission this workflow does not grant.
            #
            # vendor-scoped/ is excluded the way Plugin Check itself excludes vendor/: it holds
            # third-party libraries only. Action Scheduler ships there unmodified, so
            # it keeps its own text domain, which Plugin Check reports as several hundred errors
            # that are not ours to fix. First-party code gets no exclusion of any kind.
            - name: Run Plugin Check
              uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
              with:
                  build-dir: ./plugin/seocart
                  exclude-directories: vendor-scoped
                  repo-token: ''

    install-smoke:
        needs:
            - packaging-validate
            - build-upgrade-base
        name: install-smoke (${{ matrix.php }}, WordPress ${{ matrix.wordpress }})
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                include:
                    - php: PHP floor
                      wordpress: '7.1'
                    - php: current PHP
                      wordpress: latest
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: ${{ env.SEOCART_CI_DB_PASSWORD }}
                    MYSQL_DATABASE: ${{ env.SEOCART_CI_DB_NAME }}
                ports:
                    - 3306:3306
                # --host forces TCP: while the image initialises, MySQL listens on its socket
                # only, so the container turns healthy when the real server accepts connections.
                options: >-
                    --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=24
        steps:
            # The checkout supplies bin/ci/ only; the plugin under test comes from the zip.
            - *checkout

            # WP-CLI creates the site and installs the zip; WordPress needs mysqli.
            - name: Set up PHP and Composer
              uses: ./.github/actions/setup-php-composer
              with:
                  php-version: ${{ matrix.php == 'PHP floor' && env.PHP_FLOOR || '' }}
                  extensions: mysqli
                  tools: wp-cli:2.12.0
                  install: none

            - *download-zip

            # Outside the checkout: nothing the checkout's own tests scan holds a stray zip.
            - name: Download the earlier zip
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: ${{ env.UPGRADE_BASE_ARTIFACT }}
                  path: ${{ runner.temp }}/upgrade-base

            # The lifecycle of the zip: install, upgrade from the earlier zip with data in the
            # tables, deactivate, reactivate, uninstall with the store preserved, and a network.
            # The facts it proved are kept for the smoke-suite job of ci.yml, which reports them.
            - name: Install the zip on fresh WordPress sites
              run: |
                  mkdir -p "$RUNNER_TEMP/proof"
                  set -- "$RUNNER_TEMP"/upgrade-base/seocart-*.zip
                  SEOCART_CI_OLD_ZIP=$1 SEOCART_CI_PROOF_FILE="$RUNNER_TEMP/proof/proved.txt" \
                    sh bin/ci/install-smoke.sh dist/seocart-*.zip "${{ matrix.wordpress }}"

            - name: Keep what the install smoke test proved
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: install-smoke-proof-${{ matrix.wordpress }}
                  path: ${{ runner.temp }}/proof/proved.txt
                  if-no-files-found: error
                  retention-days: 14
