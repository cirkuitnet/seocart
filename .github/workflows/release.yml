# Release: a pushed tag vX.Y.Z becomes a GitHub Release with the zip and its checksum.
#
#   release-gates -> package (build -> packaging-validate -> plugin-check, install-smoke)
#                 -> publish
#
# The zip is built and proven by reusable-package.yml, the same jobs every pull request
# runs. `publish` needs all of them, so a release that fails its own install smoke test
# is never published.
#
# This workflow does NOT deploy to WordPress.org. Pushing to the directory's SVN
# repository is what makes a plugin live and it cannot be undone, so that step is
# deploy-wporg.yml, which only ever starts by hand. Pre-1.0 releases ship from GitHub
# only.

name: Release

on:
    push:
        # GitHub tag filters use glob syntax, not regular expressions, so the script in the
        # step below performs the exact final-version check.
        tags:
            - 'v[0-9]+.[0-9]+.[0-9]+'

# Least privilege: only `publish` may write, and only to releases.
permissions:
    contents: read

# Two runs for one tag must never race to create the same release.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

env:
    PHP_VERSION: '8.4'

jobs:
    release-gates:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            actions: read
            contents: read
        steps:
            # Full history: the ancestry check below needs main.
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            # Reachability and a successful run are separate facts, so both are checked.
            - name: Require the tagged commit to be on main
              run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

            # Branch protection is configured outside the repository, so the workflow checks
            # the CI result for this exact commit itself.
            - name: Require successful CI for the tagged commit
              run: |
                  successful_runs=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
                  if [ "$successful_runs" -lt 1 ]; then
                    echo "::error::No completed, successful CI workflow run exists for $GITHUB_SHA."
                    exit 1
                  fi
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}

            - name: Set up PHP ${{ env.PHP_VERSION }}
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  ini-file: development
                  coverage: none

            # WordPress.org guideline 15 requires every release to increase its version. The Version
            # header equals the tag (checked by `composer wporg:check`), so tags compare versions.
            - name: Require the version to be greater than the previous release
              run: sh bin/ci/require-version-increase.sh "$GITHUB_REF_NAME"

            - name: Find the Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer downloads
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-${{ runner.os }}-

            - name: Install Composer dependencies
              run: composer install --no-interaction --no-progress --prefer-dist

            # The plugin header, the readme's Stable tag and the git tag must agree. The tag
            # reaches the shell through the environment, never through text substituted into
            # the script.
            - name: Run the WordPress.org directory checks against the tag
              run: composer wporg:check -- --tag="$TAG"
              env:
                  TAG: ${{ github.ref_name }}

            - name: Check the licences of the runtime dependencies
              run: composer licenses:check

            # Fails when CHANGELOG.md has no section for this version. `publish` prints the
            # same section again as the release notes.
            - name: Require a changelog section for this version
              run: sh bin/ci/release-notes.sh "$TAG"
              env:
                  TAG: ${{ github.ref_name }}

    package:
        needs: release-gates
        uses: ./.github/workflows/reusable-package.yml

    # Known release gap: the architecture requires build provenance through GitHub artifact
    # attestations, but they are unavailable to this private repository on its current plan.
    # Add attestations before the first public release.
    publish:
        needs: package
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: write
        env:
            TAG: ${{ github.ref_name }}
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Download the zip and its checksum
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: ${{ needs.package.outputs.artifact }}
                  path: dist

            # bin/build-zip.php wrote SHA256SUMS when it built the zip. This verifies that the
            # zip about to be published is still that zip; it does not compute the checksum
            # again. --strict also fails on a malformed line.
            - name: Verify the zip against SHA256SUMS
              working-directory: dist
              run: sha256sum --check --strict SHA256SUMS

            - name: Write the release notes
              run: sh bin/ci/release-notes.sh "$TAG" > "$RUNNER_TEMP/release-notes.md"

            - name: Publish the GitHub Release
              run: |
                  gh release create "$TAG" dist/seocart-*.zip dist/SHA256SUMS \
                    --verify-tag \
                    --title "SEOCart ${TAG#v}" \
                    --notes-file "$RUNNER_TEMP/release-notes.md"
              env:
                  GH_TOKEN: ${{ github.token }}
