# Continuous integration: every gate a pull request must pass.
#
# Every job runs the repository's own scripts (`composer <script>`, `npm run <script>`,
# `php bin/<tool>.php`, `sh bin/ci/<tool>.sh`). A workflow never restates a command line
# that a script owns, so a gate that fails here fails the same way, with the same
# command, on a developer machine.
#
# Job graph (arrows are `needs`):
#
#   lint-php ------+-> static-analysis --+-> integration-tests (PHP x WordPress), integration-tests-multisite, query-plans,
#                  |                     |    multilingual-conformance
#                  +-> unit-tests -------+-> package: build -> packaging-validate
#                  +-> dry-gates         |                       -> plugin-check
#                  +-> docs-drift        |                       -> install-smoke
#                  +-> wporg-gates       |
#                  +-> extension-kit     |
#   js-lint-test ------------------------+ (package only)
#   workflow-lint
#   lint-php, static-analysis, unit-tests, integration-tests, package ----> smoke-suite (reports the
#   baseline smoke tests as one list, from what these jobs did)
#
# Required checks for branch protection on main: lint-php, workflow-lint, static-analysis,
# dry-gates, docs-drift, wporg-gates, every unit-tests cell, the "WordPress 7.1"
# integration-tests cells, integration-tests-multisite, query-plans, js-lint-test, and the
# package jobs. The WordPress nightly cells are informational. multilingual-conformance must
# pass like any other job (it is not allow-failure), but it is not a required check either,
# because it downloads Polylang from wordpress.org at test time; the merge script still refuses
# any merge whose checks did not all pass. smoke-suite is not a required check either: it
# reports what the jobs above did as the one list "all 17 smoke tests are green". Nor is
# extension-kit, which runs a generated extension's gates against this commit.
#
# The local setup action owns the development PHP version and Composer installation.
# bin/ci/check-workflows.sh keeps these steps in the action and checks action pins.
# The Node.js version is stated once, in .nvmrc.

name: CI

on:
    pull_request:
    push:
        branches:
            - main

permissions:
    contents: read

# A newer push to a pull request supersedes the run in progress. Runs on main are never
# cancelled: every commit on main keeps a complete result.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    lint-php:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - &checkout
              name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # Without scripts: a syntax check and PHP_CodeSniffer read files and never load a
            # class, so they do not need vendor-scoped/. Composer plugins still run, which is
            # what registers the coding standards with PHP_CodeSniffer.
            - name: Set up PHP and Composer
              uses: ./.github/actions/setup-php-composer
              with:
                  install: no-scripts

            - name: Validate composer.json
              run: composer validate --strict

            - name: Check PHP syntax
              run: composer lint:php

            - name: Check coding standards
              run: composer cs

    static-analysis:
        needs: lint-php
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - *checkout
            - &setup-php-full
              name: Set up PHP and Composer
              uses: ./.github/actions/setup-php-composer
              with:
                  install: full

            - name: Run PHPStan
              run: composer stan

    # The DRY rules described in docs/testing.md that need no database. The integration
    # half of `composer test:contracts` runs inside integration-tests, because
    # `composer test:integration` runs every group of that suite.
    dry-gates:
        needs: lint-php
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - *checkout
            - *setup-php-full

            - name: Run the DRY and compliance sniffs
              run: composer cs:dry

            # The script fails when the group is empty: a contract gate that runs no test, for
            # example after the group was renamed, must not pass.
            - name: Run the contract tests of the unit suite
              run: composer test:contracts:unit

            - name: Run the self-tests of the sniffs and checkers
              run: composer test:tools

    docs-drift:
        needs: lint-php
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - *checkout
            - *setup-php-full

            - name: Check that generated documents match their sources
              run: composer docs:check

    # The WordPress.org directory rules that can be checked without a built zip. Zip size
    # and contents are checked by "package / packaging-validate", Plugin Check by
    # "package / plugin-check", and the agreement of the version with the git tag by
    # release.yml.
    wporg-gates:
        needs: lint-php
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - *checkout
            - *setup-php-full

            - name: Run the WordPress.org directory checks
              run: composer wporg:check

            - name: Check the licences of the runtime dependencies
              run: composer licenses:check

    unit-tests:
        name: unit-tests (PHP ${{ matrix.php }})
        needs: lint-php
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                php: &php-versions ['8.3', '8.4', '8.5']
        steps:
            - *checkout

            - name: Set up PHP and Composer
              uses: ./.github/actions/setup-php-composer
              with:
                  php-version: ${{ matrix.php }}
                  install: full

            # The syntax check runs on every supported PHP version, not only in lint-php.
            - name: Check PHP syntax
              run: composer lint:php

            - name: Run the unit suite
              run: composer test:unit

    # Support window: the current WordPress major and the two before it (SECURITY.md). At
    # first release the floor IS 7.1, so the window holds one release line today. It rolls
    # forward: add each new line when it ships, and drop the
    # oldest once there are three. "nightly" is allowed to fail and is never a required
    # check.
    integration-tests:
        name: integration-tests
        needs:
            - static-analysis
            - unit-tests
        strategy:
            fail-fast: false
            matrix:
                php: *php-versions
                wp: ['7.1', 'nightly']
        uses: ./.github/workflows/reusable-integration-tests.yml
        with:
            php: ${{ matrix.php }}
            wp: ${{ matrix.wp }}
            allow-failure: ${{ matrix.wp == 'nightly' }}

    # The same suite on a WordPress network (WP_MULTISITE=1), where every site installs the
    # plugin by itself and the tests that only mean something on a network run instead of
    # skipping. One cell: PHP 8.4, WordPress 7.1. A job of its own rather
    # than an `include` in the matrix above: an include that matches the 8.4 / 7.1 cell would be
    # merged into it, and would rename a required check. This job is itself a required check.
    integration-tests-multisite:
        name: integration-tests-multisite
        needs:
            - static-analysis
            - unit-tests
        uses: ./.github/workflows/reusable-integration-tests.yml
        with:
            php: '8.4'
            wp: '7.1'
            multisite: true

    # The query plans of the plugin's reads on the medium reference dataset: `composer
    # test:query-plans` seeds it into the cell's own database, prints how long seeding took, and
    # EXPLAINs every plugin SELECT the reads send (docs/testing.md). A required check.
    query-plans:
        name: query-plans
        needs:
            - static-analysis
            - unit-tests
        uses: ./.github/workflows/reusable-integration-tests.yml
        with:
            wp: '7.1'
            script: test:query-plans

    # The multilingual lifecycle conformance suite against a real Polylang (free), at the one
    # pinned version bin/ci/polylang-pin.env states; this job verifies the download's checksum,
    # and bin/dev/provision-site.sh --with-polylang installs the same version (unverified) for a
    # developer's disposable site. It downloads Polylang from wordpress.org at test time, which
    # is why it is not among the required checks above, even though a red run here fails this
    # job like any other (it is not allow-failure).
    multilingual-conformance:
        name: multilingual-conformance
        needs:
            - static-analysis
            - unit-tests
        uses: ./.github/workflows/reusable-integration-tests.yml
        with:
            wp: '7.1'
            script: test:multilingual-conformance
            polylang: true

    js-lint-test:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - *checkout

            - name: Set up Node from .nvmrc
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Install npm dependencies
              run: npm ci

            # ESLint, stylelint and the Prettier check.
            - name: Lint JavaScript, styles and formatting
              run: npm run lint

            - name: Run the JavaScript unit tests
              run: npm run test:unit

            # These self-tests need no site or secrets. They keep the accessibility helper,
            # the fail-fast logic and the session-file ignore rule from rotting. They spawn
            # `git check-ignore`, so this job needs the real checkout above.
            - name: Install the Playwright browser
              run: npx playwright install --with-deps chromium

            - name: Check the Playwright types
              run: npm run typecheck

            - name: Run the end-to-end harness self-tests
              run: npm run test:e2e:selftest

    # actionlint (which runs shellcheck over every `run:` block), shellcheck over bin/ci/,
    # and the shared setup, pins and remaining agreement rules. All three
    # are in the script, which runs the same way on a developer machine.
    workflow-lint:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        env: &actionlint-pin
            # actionlint publishes no action and is not an npm or Composer package, so
            # Dependabot cannot see this pin: raise the version and the checksum together, by
            # hand, from the checksums file of the release. shellcheck is part of the runner
            # image. extension-ci.yml repeats the pin, and bin/ci/check-workflows.sh keeps the
            # two equal.
            ACTIONLINT_VERSION: '1.7.12'
            ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        steps:
            - *checkout

            - &install-actionlint
              name: Install actionlint
              run: |
                  archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
                  curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
                    "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
                  echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
                  mkdir -p "$RUNNER_TEMP/bin"
                  tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" actionlint
                  echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

            - name: Lint the workflows and the CI scripts
              run: sh bin/ci/check-workflows.sh

    package:
        needs:
            - static-analysis
            - unit-tests
            - js-lint-test
        uses: ./.github/workflows/reusable-package.yml

    # The extension kit against this commit: bin/dev/new-extension.sh writes an extension beside
    # the checkout, then its workflows are linted and its pins checked, and bin/ci/extension.sh
    # runs every gate of it that needs no database (PHP syntax, coding standards, PHPStan, the
    # unit suite, the private-reference check, the zip), as the extension's own CI would. A
    # change to a template, to a shared rule or to a gate that would break every extension
    # fails here, on the pull request that makes it. Not a required check.
    extension-kit:
        needs: lint-php
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        env: *actionlint-pin
        steps:
            # Checked out as seocart/, so that the generated extension finds it beside itself.
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  path: seocart
                  persist-credentials: false

            - name: Set up PHP and Composer
              uses: ./seocart/.github/actions/setup-php-composer
              with:
                  working-directory: seocart
                  install: no-scripts

            - *install-actionlint

            - name: Generate an extension
              run: sh seocart/bin/dev/new-extension.sh seocart-gateway-for-example --type=payments --label=Example

            - name: Lint the extension's workflows and check its pins
              run: sh seocart/bin/ci/check-workflows.sh seocart-gateway-for-example

            # The extension is staged, not committed, so the zip's timestamp comes from SOURCE_DATE_EPOCH.
            - name: Run the extension's gates that need no database
              run: sh seocart/bin/ci/extension.sh all seocart-gateway-for-example
              env:
                  SOURCE_DATE_EPOCH: '1767225600'

    # The baseline smoke tests as one list (bin/ci/smoke-suite.sh --report): its output is one
    # line per check, so "all 17 green" is a single answer. It does no work the jobs above did
    # not already do. It waits for the gate jobs and for `package`, takes the results of cs,
    # stan, unit and integration from them, and the install smoke facts from the files that
    # `package / install-smoke` uploaded; it runs only the cheap, filtered PHPUnit checks
    # itself, and reads check 15 from the end-to-end workflow's run for this commit, when
    # there is one. It reports whatever the jobs ended with, so it runs after a failure too. It
    # stays out of the required checks until the maintainer decides it should be one.
    smoke-suite:
        needs:
            - lint-php
            - static-analysis
            - unit-tests
            - integration-tests
            - package
        if: ${{ !cancelled() }}
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        permissions:
            actions: read
            contents: read
        env:
            # Throwaway values for the MySQL service container below, as in
            # reusable-integration-tests.yml: not secrets, used for nothing but CI.
            SEOCART_CI_DB_HOST: '127.0.0.1:3306'
            SEOCART_CI_DB_USER: root
            SEOCART_CI_DB_PASSWORD: ci-throwaway
            SEOCART_CI_DB_NAME: seocart_tests
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: ${{ env.SEOCART_CI_DB_PASSWORD }}
                    MYSQL_DATABASE: ${{ env.SEOCART_CI_DB_NAME }}
                ports:
                    - 3306:3306
                # --host forces TCP: while the image initialises, MySQL listens on its socket
                # only, so the container turns healthy when the real server accepts connections.
                options: >-
                    --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=24
        steps:
            - *checkout

            - name: Set up PHP and Composer
              uses: ./.github/actions/setup-php-composer
              with:
                  extensions: mysqli
                  tools: wp-cli
                  install: full

            - name: Download WordPress and write the test configuration
              run: sh bin/ci/prepare-integration.sh "$WP_VERSION"
              env:
                  WP_VERSION: '7.1'

            # Outside the checkout. A `package` that failed uploaded nothing, and the report then
            # says so on the lines that need it, so this step may find no artifact.
            - name: Download what the install smoke test proved
              continue-on-error: true
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  pattern: install-smoke-proof-*
                  path: ${{ runner.temp }}/install-smoke-proof

            - name: Report the smoke tests
              run: sh bin/ci/smoke-suite.sh --report "$RUNNER_TEMP/install-smoke-proof"
              env:
                  SEOCART_CI_RESULT_CS: ${{ needs.lint-php.result }}
                  SEOCART_CI_RESULT_STAN: ${{ needs.static-analysis.result }}
                  SEOCART_CI_RESULT_UNIT: ${{ needs.unit-tests.result }}
                  SEOCART_CI_RESULT_INTEGRATION: ${{ needs.integration-tests.result }}
                  SEOCART_CI_RESULT_PACKAGE: ${{ needs.package.result }}
                  SEOCART_CI_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
