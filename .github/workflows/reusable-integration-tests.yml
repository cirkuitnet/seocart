# One cell of the WordPress integration suite: one PHP version against one WordPress
# version, on a real MySQL 8.4 server. WordPress Playground and SQLite are not a
# correctness oracle for this plugin, so there is no cell without MySQL.
#
# Reusable because two workflows run it: ci.yml (the PHP x WordPress matrix, the multisite
# cell, the query-plan cell and the multilingual-conformance cell) and nightly.yml (WordPress
# nightly). Every command below is one of the repository's own scripts, so the same cell runs
# on a developer machine with the same two lines. A cell runs the whole suite unless its
# caller names another Composer script; only then does the script's name join the cell's
# name, so the names of the existing cells, some of them required checks, do not change.

name: Integration tests (reusable)

on:
    workflow_call:
        inputs:
            php:
                description: 'PHP version, for example "8.5". Left out, the cell runs on the version the plugin is developed on.'
                required: false
                type: string
                default: ''
            wp:
                description: 'A WordPress release line ("7.1"), an exact release ("7.1.1"), "latest" or "nightly".'
                required: true
                type: string
            allow-failure:
                description: 'Report a failing cell without failing the workflow that called it.'
                required: false
                type: boolean
                default: false
            multisite:
                description: 'Run the suite on a WordPress network: the test library installs one when WP_MULTISITE is 1.'
                required: false
                type: boolean
                default: false
            script:
                description: 'The Composer script that runs the tests, for example "test:query-plans". Left out, the whole integration suite.'
                required: false
                type: string
                default: test:integration
            polylang:
                description: 'Download Polylang (free) at the pinned version through bin/ci/download-polylang.sh, and export SEOCART_ML_ADAPTER and SEOCART_ML_PLUGIN for the test step.'
                required: false
                type: boolean
                default: false

permissions:
    contents: read

env:
    # Throwaway values for the MySQL service container below. The container exists for the
    # length of one job and is reachable from nowhere else; these are not secrets and are
    # used for nothing but CI. bin/ci/prepare-integration.sh reads them.
    SEOCART_CI_DB_HOST: '127.0.0.1:3306'
    SEOCART_CI_DB_USER: root
    SEOCART_CI_DB_PASSWORD: ci-throwaway
    SEOCART_CI_DB_NAME: seocart_tests

jobs:
    integration:
        name: PHP ${{ inputs.php || '(development version)' }}, WordPress ${{ inputs.wp }}${{ inputs.multisite && ', multisite' || '' }}${{ inputs.script != 'test:integration' && format(', {0}', inputs.script) || '' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        continue-on-error: ${{ inputs.allow-failure }}
        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ROOT_PASSWORD: ${{ env.SEOCART_CI_DB_PASSWORD }}
                    MYSQL_DATABASE: ${{ env.SEOCART_CI_DB_NAME }}
                ports:
                    - 3306:3306
                # --host forces TCP: while the image initialises, MySQL listens on its socket
                # only, so the container turns healthy when the real server accepts connections.
                options: >-
                    --health-cmd="mysqladmin ping --host=127.0.0.1 --silent"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=24
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up PHP and Composer
              uses: ./.github/actions/setup-php-composer
              with:
                  php-version: ${{ inputs.php }}
                  extensions: mysqli
                  tools: wp-cli
                  install: full

            # Nightly uses the master test library built from WordPress trunk. Other cells
            # keep the library pinned in composer.lock; the nightly workspace change is local.
            - name: Match the WordPress nightly test library to trunk
              if: ${{ inputs.wp == 'nightly' }}
              run: |
                  composer require --dev wp-phpunit/wp-phpunit:dev-master --no-interaction --no-progress --prefer-dist --no-scripts
                  composer show wp-phpunit/wp-phpunit | grep -E '^(versions|source) *:'

            - name: Download WordPress and write the test configuration
              run: sh bin/ci/prepare-integration.sh "$WP_VERSION"
              env:
                  WP_VERSION: ${{ inputs.wp }}

            # bin/ci/polylang-pin.env names the one version this downloads and verifies;
            # bin/dev/provision-site.sh --with-polylang installs the same one. The script's
            # progress lines go to stderr, so its stdout is exactly the path to capture.
            - name: Download Polylang and point the suite at it
              if: ${{ inputs.polylang }}
              run: |
                  plugin=$(sh bin/ci/download-polylang.sh "$RUNNER_TEMP/polylang")
                  {
                      echo "SEOCART_ML_ADAPTER=polylang"
                      echo "SEOCART_ML_PLUGIN=$plugin"
                  } >>"$GITHUB_ENV"

            # The child processes some tests start inherit WP_MULTISITE, so they boot the same network.
            - name: Run the integration suite
              if: ${{ !inputs.polylang }}
              run: composer "$TEST_SCRIPT"
              env:
                  TEST_SCRIPT: ${{ inputs.script }}
                  WP_MULTISITE: ${{ inputs.multisite && '1' || '0' }}

            # A skipped test is not a PHPUnit failure and PHPUnit's default summary prints no
            # reason, so a wrong plugin path or a wrong SEOCART_ML_* variable above would
            # otherwise leave this job green while covering nothing. This step reads PHPUnit's
            # own "Tests: N" / "Skipped: N" summary and fails the job when every test in the
            # group was skipped. `tee` streams the run's own output live (so a hang is visible)
            # while also keeping a copy to grep; GitHub's default bash already runs with
            # -o pipefail, stated here so the pipeline's status is composer's, not tee's, even
            # if that default ever changes.
            - name: Run the integration suite and confirm Polylang actually ran
              if: ${{ inputs.polylang }}
              run: |
                  set -o pipefail
                  log="$RUNNER_TEMP/multilingual-conformance.log"
                  if composer "$TEST_SCRIPT" 2>&1 | tee "$log"; then
                      status=0
                  else
                      status=$?
                  fi
                  if [ "$status" -eq 0 ]; then
                      skipped=$(grep -Eo 'Skipped: [0-9]+' "$log" | tail -n1 | grep -Eo '[0-9]+') || skipped=0
                      : "${skipped:=0}"
                      if [ "$skipped" -gt 0 ]; then
                          total=$(grep -Eo 'Tests: [0-9]+' "$log" | tail -n1 | grep -Eo '[0-9]+') || total=0
                          : "${total:=0}"
                          if [ "$total" -gt 0 ] && [ "$skipped" -eq "$total" ]; then
                              echo "::error::every multilingual-conformance test was skipped ($skipped of $total); Polylang likely did not load."
                              exit 1
                          fi
                      fi
                  fi
                  exit "$status"
              env:
                  TEST_SCRIPT: ${{ inputs.script }}
                  WP_MULTISITE: ${{ inputs.multisite && '1' || '0' }}
